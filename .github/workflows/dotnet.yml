name: .NET
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AIConversationStudio.sln --locked-mode
      - run: dotnet build AIConversationStudio.sln --configuration Release --no-restore
      - run: dotnet test AIConversationStudio.sln --configuration Release --no-build --no-restore
      - run: dotnet run --project src/AIConversationStudio.Console --configuration Release --no-build -- --history script
